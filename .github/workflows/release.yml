name: release

# Builds and publishes a signed release.
#
# Required repository secrets:
#   SIGNING_PFX_BASE64   base64 of .secrets\OpenInOpenCode.pfx
#   SIGNING_PFX_PASSWORD the PFX password
#
# Tag the release with the package version (v0.8.0.1) so the .appinstaller bundle URL
# matches what make-appinstaller.ps1 generates.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install llvm-mingw (arm64)
        shell: pwsh
        run: |
          $release = Invoke-RestMethod 'https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -like '*ucrt-x86_64.zip' } | Select-Object -First 1
          Write-Host "using $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile llvm-mingw.zip
          Expand-Archive -Path llvm-mingw.zip -DestinationPath .tools/llvm -Force

      - name: Restore signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force .secrets | Out-Null
          if ($env:PFX_BASE64) {
            [IO.File]::WriteAllBytes('.secrets/OpenInOpenCode.pfx', [Convert]::FromBase64String($env:PFX_BASE64))
            Set-Content -Path '.secrets/password.txt' -Value $env:PFX_PASSWORD -NoNewline
            Write-Host 'using the signing certificate from repository secrets'
          } else {
            # Self-contained fallback: the release still installs because install.ps1 trusts the
            # published .cer. Set the secrets above for a stable signer across releases.
            Write-Host 'no signing secrets configured; generating a self-signed certificate for this release'
            ./scripts/new-cert.ps1 -Force
          }

      - name: Export public certificate
        shell: pwsh
        run: |
          $password = Get-Content '.secrets/password.txt' -Raw
          $certificate = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(
              '.secrets/OpenInOpenCode.pfx', $password)
          [IO.File]::WriteAllBytes('.secrets/OpenInOpenCode.cer',
              $certificate.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))

      - name: Trust the signing certificate
        shell: pwsh
        run: |
          Import-Certificate -FilePath .secrets/OpenInOpenCode.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Write-Host 'certificate trusted, so signtool verify can validate the chain'

      - name: Build, sign and bundle
        shell: pwsh
        run: ./scripts/package.ps1 -InstallTools -Sign

      - name: Generate .appinstaller
        shell: pwsh
        run: ./scripts/make-appinstaller.ps1 -Repo ${{ github.repository }}

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -InstallTools

      - name: Stage fixed-name assets
        shell: pwsh
        run: |
          $identity = Get-Content packaging/identity.json -Raw | ConvertFrom-Json
          Copy-Item "out/OpenInOpenCodeSetup-$($identity.version).exe" out/OpenInOpenCodeSetup.exe
          Copy-Item scripts/install-oneliner.ps1 out/install.ps1

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/OpenInOpenCode_*.msixbundle
            out/OpenInOpenCode.appinstaller
            out/OpenInOpenCode.cer
            out/OpenInOpenCodeSetup-*.exe
            out/OpenInOpenCodeSetup.exe
            out/install.ps1
          fail_on_unmatched_files: true
